version: '3.8'

services:
  # --- INFRASTRUTTURA ---

  nats:
    image: nats:2.10-alpine
    command: "-js"
    ports:
      - "8222:8222"

  # 🧠 Redis (stato condiviso)
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  # --- MICROSERVIZI ---

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - CATALOG_SERVICE_ADDR=catalog-service:50052
      - BOOKING_SERVICE_ADDR=booking:50051
    depends_on:
      - catalog-service
      - booking

  catalog-service:
    build:
      context: .
      dockerfile: movie-catalog/Dockerfile
    environment:
      - PORT=50052

  # 🎟️ Booking Service (SCALABILE)
  booking:
    build:
      context: .
      dockerfile: booking/Dockerfile
    environment:
      - PORT=50051
      - NATS_URL=nats://nats:4222
      - REDIS_ADDR=redis:6379
    depends_on:
      - nats
      - redis

  notification-service:
    build:
      context: .
      dockerfile: notification/Dockerfile
    environment:
      - NATS_URL=nats://nats:4222
    depends_on:
      - nats

networks:
  default:
    name: cinema-network
