version: '3.8'

services:
  # --- INFRASTRUTTURA ---

  nats:
    image: nats:2.10-alpine
    container_name: nats-broker
    command: "-js --sd /data" # Abilita JetStream e imposta cartella dati
    volumes:
      - nats_data:/data
    ports:
      - "4222:4222"
      - "8222:8222"



  # Redis (stato condiviso)
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"

  # --- MICROSERVIZI ---

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - CATALOG_SERVICE_ADDR=catalog-service:50052
      - BOOKING_SERVICE_ADDR=booking:50051
      - RECOMMENDATION_SERVICE_ADDR=recommendation-service:50053
    depends_on:
      - catalog-service
      - booking

  catalog-service:
    build:
      context: .
      dockerfile: movie-catalog/Dockerfile
    environment:
      - PORT=50052
      - CATALOG_FILE=/app/movies.json

  # Booking Service (SCALABILE)
  booking:
    build:
      context: .
      dockerfile: booking/Dockerfile
    environment:
      - PORT=50051
      - REDIS_ADDR=redis:6379
      - NATS_URL=nats://nats:4222
      - CATALOG_FILE=/app/movies.json
      - REDIS_TIMEOUT=2s
      - NATS_STREAM=BOOKINGS_STREAM
      - NATS_SUBJECT_ALL=bookings.>
      - NATS_SUBJECT_EVENTS=bookings.event.*
      - NATS_SUBJECT_PREFIX=bookings.event
      - LOCK_TTL=5s
      - RESTORE_TIMEOUT=500ms
      - DEFAULT_STRATEGY=default
    depends_on:
      - nats
      - redis

  notification-service:
    build:
      context: .
      dockerfile: notification/Dockerfile
    deploy:
     restart_policy:
      condition: on-failure
      delay: 5s
      max_attempts: 3
    environment:
      - NATS_URL=nats://nats:4222
    depends_on:
      - nats
      
  recommendation-service:
   build:
    context: .
    dockerfile: recommendation/Dockerfile
   environment:
    - NATS_URL=nats://nats:4222
    - REDIS_ADDR=redis:6379
    - CATALOG_SERVICE_ADDR=catalog-service:50052
   depends_on:
    - nats
    - redis
    - catalog-service

volumes:
  nats_data:
  
networks:
  default:
    name: cinema-network
